<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="AXID Lab 홈">
        <span class="brand-mark" aria-hidden="true">AX</span>
        <span>
          <strong>AXID Lab</strong>
          <small>Research · Teaching · Innovation</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="{{ '/#about' | relative_url }}">연구실</a>
        <a href="{{ '/#research' | relative_url }}">연구 철학</a>
        <a href="{{ '/#teaching' | relative_url }}">교육</a>
        <a href="{{ '/#innovation' | relative_url }}">산학협력</a>
        <a class="nav-cta" href="https://axidlab-ai.github.io/lecture/">강의 아카이브</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="shell page-shell">
    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p><strong>AXID Lab</strong> · Tech University of Korea</p>
      <p>Data-driven Decisions · Field-driven Innovation · Responsible AI</p>
    </div>
  </footer>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X54WJ7XZT4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X54WJ7XZT4');
  </script>
</body>
</html>
